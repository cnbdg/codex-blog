name: Sync content pages and deploy

on:
  push:
    branches: [main]
  schedule:
    # GitHub schedules use UTC. Running off the top of the hour reduces delays.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: content-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Read public content and generate pages
        run: npm run build:pages

      - name: Verify generated pages
        run: node tools/content-pages-self-check.mjs

      - name: Decide whether deployment is needed
        id: plan
        shell: bash
        run: |
          changed=false
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            changed=true
          fi
          deploy=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$changed" = "false" ]; then
            deploy=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Save newly generated routes
        if: github.event_name == 'schedule' && steps.plan.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "cnbdg-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.min.js style.min.css content-index.js content-pages.json article.html thread.html articles threads vendor
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync public content pages"
            git push origin HEAD:main
          fi

      - name: Prepare minimal Pages artifact
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        run: |
          mkdir -p _site
          cp index.html app.min.js style.min.css article.html thread.html CNAME _site/
          cp -R articles threads admin vendor _site/
          if [ -f d7851afb375735d6c318cd4d242a96de.txt ]; then
            cp d7851afb375735d6c318cd4d242a96de.txt _site/
          fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
