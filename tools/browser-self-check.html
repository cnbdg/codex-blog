<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>博客浏览器自检</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0}#result{position:fixed;z-index:9;inset:0;margin:0;padding:20px;background:#fff;color:#111;white-space:pre-wrap}#result[data-status="running"]{display:none}</style>
</head>
<body>
  <pre id="result" data-status="running">RUNNING</pre>
  <iframe id="site" title="被测博客"></iframe>
  <script>
    (() => {
      const result = document.querySelector("#result");
      const frame = document.querySelector("#site");
      const mode = new URLSearchParams(location.search).get("mode") === "mobile" ? "mobile" : "desktop";
      const runId = new URLSearchParams(location.search).get("run") || "";
      if (mode === "mobile") {
        frame.style.width = "390px";
        frame.style.height = "844px";
      }
      const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
      const assert = (condition, message) => { if (!condition) throw new Error(message); };

      function finish(status, detail) {
        result.dataset.status = status;
        result.textContent = JSON.stringify(detail);
        fetch(`/__self-check-report?run=${encodeURIComponent(runId)}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ status, detail }),
          keepalive: true
        }).catch(() => {});
      }

      frame.addEventListener("load", async () => {
        try {
          const w = frame.contentWindow;
          const d = frame.contentDocument;
          await wait(900);
          const sanitizedMarkdown = w.blogMarkdown?.render('<p>安全测试<script>window.__xss=1<\/script><a href="javascript:alert(1)" onclick="alert(2)">链接</a><img src="x" onerror="alert(3)"><video src="https://example.test/clip.mp4" onerror="alert(4)" autoplay></video></p>') || "";
          const renderedVideoMarkdown = w.blogMarkdown?.render('@[视频](https://example.test/clip.mp4)') || "";
          const baseChecks = {
            modulesLoaded: Boolean(w.blogUI && w.blogAuth && w.blogMarkdown && w.blogMotion),
            motionEnabled: d.documentElement.classList.contains("motion-enabled"),
            motionReduced: d.documentElement.classList.contains("motion-reduced"),
            motionPlatform: w.blogMotion?.state.platform || "",
            motionPlatformClass: d.documentElement.classList.contains(mode === "mobile" ? "motion-platform-ios" : "motion-platform-macos"),
            captchaConfigured: Boolean(w.BLOG_CONFIG?.captchaRequiredForAuth && w.BLOG_CONFIG?.turnstileSiteKey),
            markdownSanitized: !/script|javascript:|onerror|onclick|autoplay/i.test(sanitizedMarkdown) && !w.__xss,
            markdownVideo: /<video[^>]+controls[^>]+playsinline/i.test(renderedVideoMarkdown),
            mediaInputs: /image\/gif/.test(d.querySelector("#messageImageInput")?.accept || "") && /video\/mp4/.test(d.querySelector("#messageImageInput")?.accept || "") && /video\/mp4/.test(d.querySelector('#threadForm input[type="file"]')?.accept || ""),
            unifiedIcons: d.querySelectorAll("#mainNav a .ui-icon").length === d.querySelectorAll("#mainNav a").length,
            noGoogleFontDependency: ![...d.querySelectorAll('link[href]')].some(link => /fonts\.(googleapis|gstatic)\.com/.test(link.href)),
            darkTheme: d.body.classList.contains("dark"),
            wallpaperMode: d.body.classList.contains("has-wallpaper"),
            wallpaperChoice: d.body.dataset.wallpaperMode || "",
            wallpaperDefault: w.BLOG_CONFIG?.wallpaperSettings?.desktopDefault || "",
            wallpaperVariable: d.documentElement.style.getPropertyValue("--wallpaper"),
            bodyBackground: getComputedStyle(d.body).backgroundColor,
            heroBackground: getComputedStyle(d.querySelector("#home .social-hero")).backgroundColor,
            newestPostTitle: d.querySelector("#postList .post-item h2")?.textContent?.trim() || "",
            newestPostTime: d.querySelector("#postList .post-item time")?.textContent?.trim() || "",
            newestPostDateTime: d.querySelector("#postList .post-item time")?.dateTime || ""
          };
          assert(baseChecks.modulesLoaded, "页面核心模块没有完整加载");
          assert(baseChecks.captchaConfigured, "登录人机验证配置缺失");
          assert(baseChecks.markdownSanitized && baseChecks.markdownVideo, "Markdown 视频渲染或安全清理未通过测试");
          assert(baseChecks.mediaInputs, "社区或聊天媒体选择器没有接受 GIF/视频");
          assert(baseChecks.unifiedIcons, "主导航图标没有统一");
          assert(baseChecks.noGoogleFontDependency, "页面仍依赖 Google Fonts");
          assert(baseChecks.motionEnabled !== baseChecks.motionReduced, "动效偏好状态没有正确初始化");
          assert(baseChecks.motionPlatform === (mode === "mobile" ? "ios" : "macos") && baseChecks.motionPlatformClass, "电脑与手机动效平台没有正确隔离");
          assert(Boolean(baseChecks.newestPostTitle) && d.querySelector("#postList .post-item .type")?.textContent?.trim() === "更新日志", `本次更新日志没有显示在首页首位：${baseChecks.newestPostTitle}`);
          assert(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(baseChecks.newestPostTime) && /T\d{2}:\d{2}:\d{2}/.test(baseChecks.newestPostDateTime), "博客发布时间没有精确显示到秒");
          const restingLayers = [...d.querySelectorAll("body *")].filter(node => {
            if (node.closest("dialog:not([open])")) return false;
            const style = getComputedStyle(node);
            return node.getClientRects().length > 0 && style.visibility !== "hidden" && style.willChange !== "auto";
          }).map(node => `${node.tagName.toLowerCase()}#${node.id}.${[...node.classList].join(".")}:${getComputedStyle(node).willChange}`);
          baseChecks.restingLayers = restingLayers;
          assert(restingLayers.length === 0, `静止界面仍长期占用动画合成层：${restingLayers.join(", ")}`);

          const overlayEvents = [];
          const onOverlayChange = event => overlayEvents.push(`${event.detail?.id}:${event.detail?.open ? "open" : "closed"}`);
          w.addEventListener("blog-overlay-change", onOverlayChange);
          d.documentElement.style.setProperty("--motion-duration-sheet", "24ms");
          const searchDialog = d.querySelector("#searchDialog");
          assert(w.blogUI.openDialog(searchDialog) && w.blogUI.state.overlay === "searchDialog", "统一弹窗调度没有记录打开状态");
          // Headless Chrome dispatches animationend later than a 24ms sheet
          // suggests; poll for the settled state instead of assuming timing.
          const settledAt = Date.now();
          while (!searchDialog.classList.contains("motion-dialog-settled") && Date.now() - settledAt < 600) {
            await wait(25);
          }
          const overlayLifecycle = {
            settled: !baseChecks.motionEnabled || searchDialog.classList.contains("motion-dialog-settled"),
            settledLayer: getComputedStyle(searchDialog).willChange,
            stateWhileClosing: ""
          };
          const closePromise = w.blogUI.closeDialog(searchDialog);
          overlayLifecycle.stateWhileClosing = w.blogUI.state.overlay || "";
          await closePromise;
          overlayLifecycle.closed = !searchDialog.open;
          overlayLifecycle.stateAfterClose = w.blogUI.state.overlay;
          overlayLifecycle.events = overlayEvents.slice();
          d.documentElement.style.removeProperty("--motion-duration-sheet");
          w.removeEventListener("blog-overlay-change", onOverlayChange);
          assert(overlayLifecycle.settled && overlayLifecycle.settledLayer === "auto", `弹窗入场后没有释放合成层：${JSON.stringify(overlayLifecycle)}`);
          if (baseChecks.motionEnabled) assert(overlayLifecycle.stateWhileClosing === "searchDialog", "弹窗退场动画尚未结束时状态已被提前清空");
          assert(overlayLifecycle.closed && overlayLifecycle.stateAfterClose === null && overlayLifecycle.events.join(",") === "searchDialog:open,searchDialog:closed", `弹窗生命周期状态不同步：${JSON.stringify(overlayLifecycle)}`);

          w.toast("第一条自检消息");
          const firstToastTimer = w.toast.timer;
          w.toast("第二条自检消息");
          const secondToastTimer = w.toast.timer;
          const toastLifecycle = {
            timerReplaced: Boolean(firstToastTimer && secondToastTimer && firstToastTimer !== secondToastTimer),
            latestText: d.querySelector("#toast")?.textContent || "",
            visible: d.querySelector("#toast")?.classList.contains("show") || false
          };
          clearTimeout(secondToastTimer);
          d.querySelector("#toast")?.classList.remove("show");
          assert(toastLifecycle.timerReplaced && toastLifecycle.latestText === "第二条自检消息" && toastLifecycle.visible, "连续状态提示会被上一条旧定时器提前隐藏");
          const firstPageTitle = baseChecks.newestPostTitle;
          const pagination = d.querySelector("#pagination");
          const paginationCheck = {
            visible: !pagination.hidden,
            role: pagination.getAttribute("role"),
            current: pagination.querySelector('[aria-current="page"]')?.textContent?.trim() || "",
            previousDisabled: Boolean(pagination.querySelector(".pagination-prev")?.disabled),
            nextExists: Boolean(pagination.querySelector(".pagination-next")),
            ellipsis: pagination.querySelectorAll(".pagination-ellipsis").length,
            summary: pagination.querySelector(".pagination-summary")?.textContent?.replace(/\s+/g, " ").trim() || "",
            numberButtons: pagination.querySelectorAll(".pagination-page").length,
            fits: pagination.scrollWidth <= pagination.clientWidth + 1,
            minButtonTarget: Math.round(Math.min(...[...pagination.querySelectorAll("button")].map(button => button.getBoundingClientRect().height)))
          };
          assert(paginationCheck.visible && paginationCheck.role === "navigation", "博客分页导航没有正确显示");
          assert(paginationCheck.current === "1" && paginationCheck.previousDisabled && paginationCheck.nextExists, "分页初始状态错误");
          assert(paginationCheck.ellipsis >= 1 && /第 1 \/ \d+ 页 · 共 \d+ 篇/.test(paginationCheck.summary), "分页省略或页数统计错误");
          pagination.querySelector(".pagination-next")?.click();
          await wait(60);
          paginationCheck.secondPage = pagination.querySelector('[aria-current="page"]')?.textContent?.trim() === "2";
          paginationCheck.contentChanged = d.querySelector("#postList .post-item h2")?.textContent?.trim() !== firstPageTitle;
          pagination.querySelector(".pagination-prev")?.click();
          await wait(60);
          paginationCheck.restored = pagination.querySelector('[aria-current="page"]')?.textContent?.trim() === "1" && d.querySelector("#postList .post-item h2")?.textContent?.trim() === firstPageTitle;
          assert(paginationCheck.secondPage && paginationCheck.contentChanged && paginationCheck.restored, "上一页或下一页翻页逻辑错误");
          if (mode === "mobile") assert(paginationCheck.numberButtons <= 4 && paginationCheck.fits && paginationCheck.minButtonTarget >= 44, "手机分页拥挤、溢出或触控区域过小");
          let desktopContextCheck = null;
          if (mode === "desktop") {
            const overlapSamples = [];
            const overlapSampling = baseChecks.motionEnabled && typeof d.startViewTransition === "function"
              ? new Promise(resolveSampling => {
                  const startedAt = performance.now();
                  const sample = () => {
                    const oldOpacity = Number.parseFloat(w.getComputedStyle(d.documentElement, "::view-transition-old(page-content)").opacity);
                    const newOpacity = Number.parseFloat(w.getComputedStyle(d.documentElement, "::view-transition-new(page-content)").opacity);
                    if (d.documentElement.classList.contains("motion-view-transition") && Number.isFinite(oldOpacity) && Number.isFinite(newOpacity)) {
                      overlapSamples.push(oldOpacity + newOpacity);
                    }
                    if (performance.now() - startedAt < 315) w.requestAnimationFrame(sample);
                    else resolveSampling();
                  };
                  w.requestAnimationFrame(sample);
                })
              : Promise.resolve();
            w.blogUI?.navigate?.("forum");
            // The materialized entrance adds blur to the first transition
            // frames; poll for the navigated state instead of a fixed wait.
            const navStartedAt = Date.now();
            while (!d.querySelector('#mainNav [data-page="forum"]')?.getAttribute("aria-current") && Date.now() - navStartedAt < 600) {
              await wait(25);
            }
            const context = d.querySelector("#desktopContext");
            const contextRect = context?.getBoundingClientRect();
            desktopContextCheck = {
              exists: Boolean(context),
              display: context ? getComputedStyle(context).display : "missing",
              width: Math.round(contextRect?.width || 0),
              right: Math.round(contextRect?.right || 0),
              bodyPage: d.body.dataset.desktopPage || "",
              activeAria: d.querySelector('#mainNav [data-page="forum"]')?.getAttribute("aria-current") || "",
              navTarget: Math.round(d.querySelector('#mainNav [data-page="forum"]')?.getBoundingClientRect().height || 0),
              motionTransitions: w.blogMotion?.state.pageTransitions || 0,
              desktopTransitions: w.blogMotion?.state.desktopTransitions || 0,
              motionDirection: w.blogMotion?.state.lastDirection || "",
              motionStrategy: w.blogMotion?.state.lastStrategy || "",
              platform: w.blogMotion?.state.platform || "",
              sidebarSelection: Boolean(d.querySelector(".macos-sidebar-selection")),
              sidebarReady: d.querySelector("#mainNav")?.classList.contains("macos-selection-ready") || false,
              sidebarMoves: w.blogDesktop?.state.sidebarMoves || 0
            };
            w.scrollTo(100, 0);
            await wait(20);
            desktopContextCheck.horizontalScroll = Math.round(w.scrollX);
            w.scrollTo(0, 0);
            assert(desktopContextCheck.display !== "none" && desktopContextCheck.width >= 280, "桌面社区页右侧信息栏未显示");
            assert(desktopContextCheck.activeAria === "page" && desktopContextCheck.navTarget >= 44, `桌面导航状态或点击区域不符合要求：${JSON.stringify({ activeAria: desktopContextCheck.activeAria, navTarget: desktopContextCheck.navTarget })}`);
            assert(desktopContextCheck.horizontalScroll === 0, `桌面社区页可以横向滚动（${desktopContextCheck.horizontalScroll}px）`);
            assert(desktopContextCheck.platform === "macos" && desktopContextCheck.sidebarSelection && desktopContextCheck.sidebarReady, "macOS 桌面动效或侧栏选中层没有初始化");
            if (baseChecks.motionEnabled) {
              assert(desktopContextCheck.motionTransitions >= 1 && desktopContextCheck.desktopTransitions >= 1 && desktopContextCheck.motionDirection === "forward" && /^macos-/.test(desktopContextCheck.motionStrategy), "macOS 桌面层级转场没有启动或方向错误");
              assert(desktopContextCheck.sidebarMoves >= 1, "macOS 侧栏选中胶囊没有随页面移动");
              const pointerTarget = d.querySelector('#mainNav [data-page="forum"]');
              const pointerRect = pointerTarget.getBoundingClientRect();
              desktopContextCheck.finePointer = w.matchMedia("(hover: hover) and (pointer: fine)").matches;
              pointerTarget.dispatchEvent(new w.PointerEvent("pointermove", { bubbles: true, clientX: pointerRect.left + pointerRect.width * .7, clientY: pointerRect.top + pointerRect.height * .4 }));
              const pointerStartedAt = Date.now();
              while (!(pointerTarget.classList.contains("mac-pointer-active") && w.blogMotion.state.desktopPointerResponses >= 1) && Date.now() - pointerStartedAt < 600) {
                await wait(25);
              }
              desktopContextCheck.pointerResponse = pointerTarget.classList.contains("mac-pointer-active") && w.blogMotion.state.desktopPointerResponses >= 1;
              if (desktopContextCheck.finePointer) assert(desktopContextCheck.pointerResponse, `macOS 精细指针反馈没有启动：${JSON.stringify({ hasClass: pointerTarget.classList.contains("mac-pointer-active"), responses: w.blogMotion.state.desktopPointerResponses, motionEnabled: baseChecks.motionEnabled, finePointer: desktopContextCheck.finePointer, platform: desktopContextCheck.platform })}`);
              pointerTarget.dispatchEvent(new w.PointerEvent("pointerout", { bubbles: true }));
              await overlapSampling;
              const firstActiveOpacitySample = overlapSamples.findIndex(value => value < 1.8);
              const activeOpacitySamples = firstActiveOpacitySample >= 0 ? overlapSamples.slice(firstActiveOpacitySample) : [];
              desktopContextCheck.transitionOpacitySamples = activeOpacitySamples.length;
              desktopContextCheck.transitionOpacityTrace = activeOpacitySamples.map(value => Math.round(value * 100) / 100);
              desktopContextCheck.minCombinedTransitionOpacity = Math.round(Math.min(2, ...activeOpacitySamples) * 1000) / 1000;
              desktopContextCheck.maxCombinedTransitionOpacity = Math.round(Math.max(0, ...activeOpacitySamples) * 1000) / 1000;
              if (desktopContextCheck.motionStrategy === "macos-view-transition") {
                // Headless Chrome accelerates the View Transition so the
                // opacity sampler may only catch one frame; the overlap guard
                // is the max combined opacity, not the sample count.
                assert(desktopContextCheck.transitionOpacitySamples >= 1 && desktopContextCheck.maxCombinedTransitionOpacity <= 1.05, `桌面新旧页面仍存在叠加重影：${JSON.stringify({ samples: desktopContextCheck.transitionOpacitySamples, trace: desktopContextCheck.transitionOpacityTrace, max: desktopContextCheck.maxCombinedTransitionOpacity, strategy: desktopContextCheck.motionStrategy })}`);
              }
            }
            else assert(desktopContextCheck.motionTransitions === 0, "减少动态效果模式仍启动了大范围页面转场");
            const transitionsBeforeRapidNavigation = w.blogMotion.state.pageTransitions;
            w.blogUI.navigate("home", { history: false });
            w.blogUI.navigate("forum", { history: false });
            await wait(900);
            desktopContextCheck.rapidNavigation = {
              page: w.blogUI.state.page,
              active: d.querySelector(".page.active")?.id || "",
              transitions: w.blogMotion.state.pageTransitions - transitionsBeforeRapidNavigation,
              settled: !d.documentElement.classList.contains("motion-view-transition")
            };
            assert(desktopContextCheck.rapidNavigation.page === "forum" && desktopContextCheck.rapidNavigation.active === "forum", "快速连续切页没有停在最后一次目标");
            if (baseChecks.motionEnabled) assert(desktopContextCheck.rapidNavigation.transitions >= 2 && desktopContextCheck.rapidNavigation.settled, `可中断转场没有正常结束：${JSON.stringify(desktopContextCheck.rapidNavigation)}`);
            else assert(desktopContextCheck.rapidNavigation.transitions === 0 && desktopContextCheck.rapidNavigation.settled, "减少动态效果模式仍残留页面转场");
          }
          const viewer = { id: "00000000-0000-0000-0000-000000000001" };
          const friend = { id: "00000000-0000-0000-0000-000000000002", user_uid: 2, username: "测试好友", avatar_url: "", display_title: "好友" };
          const friend2 = { id: "00000000-0000-0000-0000-000000000003", user_uid: 3, username: "第二位好友", avatar_url: "", display_title: "成员" };
          const group = { group_id: "10000000-0000-0000-0000-000000000001", group_name: "自检交流群", group_description: "群聊交互自动测试", group_avatar_url: "", owner_id: viewer.id, group_role: "owner", member_count: 3, unread_count: 2, last_message: "晚上一起讨论吧", last_message_at: new Date().toISOString(), last_sender_name: "测试好友" };
          w.blogAuth = {
            user: viewer,
            profile: { id: viewer.id, username: "站长", user_uid: 1 },
            openAuth() {},
            getFollowState: async () => ({ mutual: true, following: true, followedBy: true }),
            listFriends: async () => [friend, friend2],
            listNotifications: async () => [],
            markNotificationsRead: async () => true,
            markDirectMessagesRead: async () => true,
            subscribeNotifications(callback) { w.__selfCheckNotification = callback; return () => {}; },
            listGroupChats: async () => [group],
            listGroupChatMessages: async () => [
              { id: 1, group_id: group.group_id, sender_id: friend.id, content: "欢迎来到群聊", media_path: `${group.group_id}/${friend.id}/welcome.gif`, created_at: new Date(Date.now() - 60000).toISOString(), sender_username: friend.username, sender_avatar_url: "", sender_uid: 2, sender_title: "好友" },
              { id: 2, group_id: group.group_id, sender_id: viewer.id, content: "群聊自检开始", media_path: `${group.group_id}/${viewer.id}/demo.mp4`, created_at: new Date().toISOString(), sender_username: "站长", sender_avatar_url: "", sender_uid: 1, sender_title: "站长" }
            ],
            listDirectMessages: async () => [],
            listGroupChatMembers: async () => [
              { user_id: viewer.id, user_uid: 1, username: "站长", avatar_url: "", display_title: "站长", member_role: "owner" },
              { user_id: friend.id, user_uid: 2, username: friend.username, avatar_url: "", display_title: "好友", member_role: "member" },
              { user_id: friend2.id, user_uid: 3, username: friend2.username, avatar_url: "", display_title: "成员", member_role: "member" }
            ],
            markGroupChatRead: async () => true,
            subscribeGroupChatMessages(groupId, callback, status) { setTimeout(() => status("SUBSCRIBED"), 0); return () => {}; },
            subscribeDirectMessages(peer, callback, status) { setTimeout(() => status("SUBSCRIBED"), 0); return () => {}; },
            createGroupChat: async () => group.group_id,
            updateGroupChat: async () => true,
            addGroupChatMembers: async (_groupId, ids) => ids.length,
            removeGroupChatMember: async () => true,
            leaveGroupChat: async () => true,
            sendGroupChatMessage: async () => true,
            sendDirectMessage: async () => true,
            getGroupChatMediaUrls: async paths => new Map(paths.map(path => [path, `https://example.test/${path.endsWith(".gif") ? "media.gif" : "media.mp4"}`])),
            uploadGroupChatMedia: async () => `${group.group_id}/${viewer.id}/upload.mp4`,
            deleteGroupChatMedia: async () => true,
            getPublicProfile: async id => ({ id, username: id === viewer.id ? "站长" : "测试好友", user_uid: id === viewer.id ? 1 : 2, display_title: "社区成员", follower_count: 1, following_count: 1 })
          };
          w.blogUI?.navigate?.("messages");
          w.dispatchEvent(new w.CustomEvent("blog-auth-change", { detail: { user: viewer } }));
          await wait(80);
          d.querySelector('[data-message-inbox-tab="groups"]')?.click();
          await wait(80);

          const listResult = {
            viewportWidth: w.innerWidth,
            viewportHeight: w.innerHeight,
            groupItems: d.querySelectorAll(".message-group-item").length,
            unread: d.querySelector(".message-group-unread")?.textContent,
            scrollWidth: d.documentElement.scrollWidth,
            clientWidth: d.documentElement.clientWidth,
            overflowRule: getComputedStyle(d.body).overflowX
          };
          w.scrollTo(100, 0);
          await wait(20);
          listResult.horizontalScroll = Math.round(w.scrollX);
          w.scrollTo(0, 0);
          assert(listResult.groupItems === 1, "群聊列表未渲染");
          assert(listResult.unread === "2", "群聊未读数未渲染");
          assert(listResult.horizontalScroll === 0, `消息页可以横向滚动（${listResult.scrollWidth}/${listResult.clientWidth}）`);
          d.querySelector(".message-group-item").click();
          await wait(100);
          const threadResult = {
            title: d.querySelector("#messageTitle")?.textContent,
            messages: d.querySelectorAll("#messageList .dm-message").length,
            senders: d.querySelectorAll(".group-message-sender").length,
            infoVisible: !d.querySelector("#messageInfoBtn")?.hidden,
            gifImages: d.querySelectorAll("#messageList .dm-image-link img").length,
            videos: d.querySelectorAll("#messageList .dm-media-card video[playsinline]").length,
            mediaPickerVisible: getComputedStyle(d.querySelector(".message-image-picker")).display !== "none"
          };
          assert(threadResult.title === "自检交流群", "群聊标题错误");
          assert(threadResult.messages === 2 && threadResult.senders === 1, "群消息或发送者信息渲染错误");
          assert(threadResult.gifImages === 1 && threadResult.videos === 1 && threadResult.mediaPickerVisible, "群聊 GIF、视频或媒体入口没有正确渲染");
          assert(threadResult.infoVisible, "群资料入口没有显示");

          if (mode === "desktop") {
            const shellWidth = Math.round(d.querySelector(".messages-shell").getBoundingClientRect().width);
            assert(shellWidth > 700, "桌面消息页宽度异常");
            d.querySelector("#messageInfoBtn").click();
            await wait(100);
            const groupInfo = {
              open: d.querySelector("#groupChatInfoDialog")?.open,
              members: d.querySelectorAll(".group-member-item").length,
              editable: !d.querySelector("#groupChatInfoForm")?.hidden,
              removeButtons: d.querySelectorAll("[data-remove-group-member]").length
            };
            assert(groupInfo.open && groupInfo.members === 3, "群资料或成员列表渲染失败");
            assert(groupInfo.editable && groupInfo.removeButtons === 2, "群主管理控件权限错误");
            w.blogUI.closeDialog(d.querySelector("#groupChatInfoDialog"));
            await wait(320);
            assert(!d.querySelector("#groupChatInfoDialog").open, "弹窗没有成功关闭");
            if (baseChecks.motionEnabled) assert(w.blogMotion.state.dialogTransitions >= 1 && w.blogMotion.state.lastDialogStrategy === "macos-panel", "macOS 面板退场动画没有完成");
            else assert(w.blogMotion.state.dialogTransitions === 0, "减少动态效果模式仍启动了弹窗位移动画");
            w.__selfCheckNotification?.({ kind: "group_message", actor_id: friend.id, actor_username: friend.username, payload: { group_id: group.group_id, group_name: group.group_name, preview: "当前会话消息" } });
            await wait(30);
            assert(d.querySelector("#incomingMessageBubble")?.hidden !== false, "当前群聊仍会重复弹出消息气泡");
            w.blogMessages.close();
            w.__selfCheckNotification?.({ kind: "group_message", actor_id: friend.id, actor_username: friend.username, payload: { group_id: group.group_id, group_name: group.group_name, preview: "其他会话消息" } });
            await wait(30);
            assert(d.querySelector("#incomingMessageBubble")?.hidden === false, "非当前会话没有显示新消息气泡");
            Object.assign(w.blogAuth, {
              isAdmin: true,
              isOwner: true,
              profile: { id: viewer.id, username: "Cnbdg", user_uid: 1, display_title: "站长", is_admin: true, is_owner: true },
              listAllPosts: async () => [{ id: 1, title: "管理界面自检文章", status: "published", published_at: new Date().toISOString() }],
              getGovernanceOverview: async () => ({ data: { pending_reports: 2, restricted_users: 1, pending_appeals: 0, actions_today: 3 }, error: "" }),
              listModerationReports: async () => ({ rows: [], error: "" }),
              listModerationUsers: async () => ({ rows: [], error: "" }),
              listModerationAppeals: async () => ({ rows: [], error: "" }),
              listModerationActions: async () => ({ rows: [], error: "" }),
              prepareAdminCaptcha() {},
              getAdminMemberByUid: async () => ({ member: { user_id: viewer.id, user_uid: 1, username: "Cnbdg", display_title: "站长", is_admin: true, is_owner: true, restricted: false, strike_count: 0 }, error: "" }),
              confirmAdminPassword: async () => true,
              adminManageMember: async () => true,
              runGovernanceMaintenance: async () => ({ data: { expired_restrictions_closed: 0 }, error: "" }),
              refreshProfile: async () => true,
              adminCaptchaReady: true
            });
            w.dispatchEvent(new w.CustomEvent("blog-auth-change", { detail: { user: viewer, profile: w.blogAuth.profile } }));
            w.blogUI.navigate("admin", { history: false, animate: false });
            await wait(160);
            const commandCenter = d.querySelector(".admin-command-center");
            const adminUi = {
              workspaceVisible: !d.querySelector("#adminWorkspace")?.hidden,
              title: d.querySelector("#admin .admin-header h1")?.textContent,
              identity: d.querySelector("#adminIdentityName")?.textContent,
              role: d.querySelector("#adminIdentityRole")?.textContent,
              protection: d.querySelector("#adminProtectionState")?.textContent,
              postCount: d.querySelector("#adminPostCount")?.textContent,
              quickActions: d.querySelectorAll(".admin-quick-actions button").length,
              commandColumns: getComputedStyle(commandCenter).gridTemplateColumns,
              commandWidth: Math.round(commandCenter?.getBoundingClientRect().width || 0)
            };
            assert(adminUi.workspaceVisible && adminUi.title === "管理中心", "新版管理中心没有正确显示");
            assert(adminUi.identity === "Cnbdg" && adminUi.role === "永久站长" && adminUi.protection === "已锁定", "永久站长身份状态没有显示");
            assert(adminUi.postCount === "1" && adminUi.quickActions === 3 && adminUi.commandWidth > 700, "管理概览或快捷入口布局异常");
            w.openMemberAdmin(1);
            await wait(100);
            const ownerDialog = {
              open: d.querySelector("#memberAdminDialog")?.open,
              state: d.querySelector("#ownerProtectionBanner")?.dataset.state,
              badge: d.querySelector("#ownerProtectionBadge")?.textContent,
              memberOwner: d.querySelector("#adminMemberPreview")?.classList.contains("is-owner"),
              roleLocked: d.querySelector('#memberAdminForm [name="role_action"]')?.disabled,
              roleHint: d.querySelector("#ownerRoleHint")?.textContent || ""
            };
            assert(ownerDialog.open && ownerDialog.state === "protected" && ownerDialog.badge === "受保护", "永久站长保护状态弹窗显示异常");
            assert(ownerDialog.memberOwner && ownerDialog.roleLocked && /角色已锁定/.test(ownerDialog.roleHint), `永久站长危险角色操作没有锁定：${JSON.stringify(ownerDialog)}`);
            w.blogUI.closeDialog(d.querySelector("#memberAdminDialog"));
            finish("pass", { mode, baseChecks, overlayLifecycle, toastLifecycle, paginationCheck, desktopContextCheck, listResult, threadResult, shellWidth, groupInfo, bubbleRules: true, adminUi, ownerDialog });
            return;
          }

          const mobileOpen = {
            bodyOpen: d.body.classList.contains("message-thread-open"),
            pageOpen: d.querySelector("#messages")?.classList.contains("chat-open"),
            conversation: getComputedStyle(d.querySelector(".message-conversation")).display
          };
          assert(mobileOpen.bodyOpen && mobileOpen.pageOpen && mobileOpen.conversation === "flex", "手机未进入全屏群聊");
          d.querySelector("#messageBackBtn").click();
          await wait(50);
          const mobileClosed = {
            bodyOpen: d.body.classList.contains("message-thread-open"),
            pageOpen: d.querySelector("#messages")?.classList.contains("chat-open"),
            inbox: getComputedStyle(d.querySelector(".messages-inbox")).display,
            conversation: getComputedStyle(d.querySelector(".message-conversation")).display,
            scrollY: Math.round(w.scrollY)
          };
          assert(!mobileClosed.bodyOpen && !mobileClosed.pageOpen, "手机返回后会话状态没有清除");
          assert(mobileClosed.inbox !== "none" && mobileClosed.conversation === "none", "手机返回后列表没有恢复");
          assert(mobileClosed.scrollY < 20, "手机关闭会话后页面跳到底部");
          d.querySelector("#createGroupChatBtn").click();
          await wait(80);
          const createDialog = {
            open: d.querySelector("#createGroupChatDialog")?.open,
            friends: d.querySelectorAll("#createGroupFriendPicker .group-friend-option").length,
            scrollWidth: d.documentElement.scrollWidth,
            clientWidth: d.documentElement.clientWidth,
            overflowSources: [...d.querySelectorAll("body *")].filter(node => {
              const rect = node.getBoundingClientRect();
              return rect.width > 0 && (rect.right > d.documentElement.clientWidth + 1 || rect.left < -1);
            }).slice(0, 8).map(node => `${node.tagName.toLowerCase()}#${node.id}.${[...node.classList].join(".")}`)
          };
          const dialogScrollY = w.scrollY;
          w.scrollTo(100, dialogScrollY);
          await wait(20);
          createDialog.horizontalScroll = Math.round(w.scrollX);
          createDialog.noHorizontalOverflow = createDialog.horizontalScroll === 0;
          assert(createDialog.open && createDialog.friends === 2, "手机创建群聊或好友选择器异常");
          assert(createDialog.noHorizontalOverflow, `手机创建群聊弹窗可以横向滚动（${createDialog.scrollWidth}/${createDialog.clientWidth}；${createDialog.overflowSources.join(", ")}）`);
          w.blogUI.closeDialog(d.querySelector("#createGroupChatDialog"));
          await wait(410);
          createDialog.closed = !d.querySelector("#createGroupChatDialog").open;
          createDialog.motionStrategy = w.blogMotion?.state.lastDialogStrategy || "";
          assert(createDialog.closed, "手机底部 Sheet 没有成功关闭");
          if (baseChecks.motionEnabled) assert(createDialog.motionStrategy === "ios-sheet", "手机弹窗误用了 macOS 面板动画");

          w.blogUI?.navigate?.("forum", { history: false });
          await wait(280);
          const mobileTransitionStart = performance.now();
          w.blogUI?.navigate?.("home", { history: false });
          const mobileTransitionCallDuration = performance.now() - mobileTransitionStart;
          const mobileActiveImmediately = d.querySelector(".page.active")?.id === "home";
          await wait(280);
          const mobileMotion = {
            activeImmediately: mobileActiveImmediately,
            callDuration: Math.round(mobileTransitionCallDuration * 10) / 10,
            strategy: w.blogMotion?.state.lastStrategy || "",
            mobileTransitions: w.blogMotion?.state.mobileTransitions || 0,
            desktopTransitions: w.blogMotion?.state.desktopTransitions || 0,
            platform: w.blogMotion?.state.platform || "",
            snapshotClass: d.documentElement.classList.contains("motion-view-transition"),
            dockMoves: w.blogMobileShell?.state.moves || 0
          };
          assert(mobileMotion.activeImmediately && mobileMotion.callDuration < 60, "手机离开社区时仍会阻塞页面切换");
          assert(!mobileMotion.snapshotClass, "手机切页仍启用了整页 View Transition 快照");
          assert(mobileMotion.platform === "ios" && mobileMotion.desktopTransitions === 0, "手机端误用了 macOS 桌面转场");
          if (baseChecks.motionEnabled) {
            assert(mobileMotion.strategy === "mobile-lightweight" && mobileMotion.mobileTransitions >= 2, "手机轻量转场策略没有启动");
            assert(mobileMotion.dockMoves >= 1, "液态底栏指示器没有响应页面切换");
          }
          const dockMovesBeforeBurst = w.blogMobileShell.state.moves;
          w.blogUI.navigate("forum", { history: false });
          w.blogUI.navigate("notifications", { history: false });
          w.blogUI.navigate("forum", { history: false });
          await wait(40);
          mobileMotion.coalescedDockMoves = w.blogMobileShell.state.moves - dockMovesBeforeBurst;
          const layoutFlushesBeforeBurst = w.blogMobileShell.state.layoutFlushes;
          for (let index = 0; index < 8; index += 1) w.dispatchEvent(new Event("resize"));
          await wait(40);
          mobileMotion.coalescedResizeFlushes = w.blogMobileShell.state.layoutFlushes - layoutFlushesBeforeBurst;
          const expectedDockMoves = baseChecks.motionEnabled ? 1 : 0;
          assert(mobileMotion.coalescedDockMoves === expectedDockMoves && mobileMotion.coalescedResizeFlushes === 1, `手机快速切页或缩放仍排队重复动画帧：${JSON.stringify(mobileMotion)}`);
          w.blogUI.navigate("home", { history: false, animate: false });
          await wait(40);
          const topbarRect = d.querySelector(".topbar")?.getBoundingClientRect();
          const heroRect = d.querySelector("#home .social-hero")?.getBoundingClientRect();
          const dock = d.querySelector("#mobileDock");
          const liquidIndicator = dock?.querySelector(".liquid-glass-indicator");
          const indicatorRect = liquidIndicator?.getBoundingClientRect();
          const visibleHeaderActions = [...d.querySelectorAll(".topbar .actions button")]
            .filter(button => getComputedStyle(button).display !== "none");
          const mobileVisual = {
            visibleHeaderActions: visibleHeaderActions.length,
            headerFits: visibleHeaderActions.every(button => button.getBoundingClientRect().right <= w.innerWidth),
            minHeaderTarget: Math.min(...visibleHeaderActions.map(button => button.getBoundingClientRect().height)),
            dockTarget: Math.min(...[...d.querySelectorAll("#mobileDock button")].map(button => button.getBoundingClientRect().height)),
            dockRadius: parseFloat(getComputedStyle(dock).borderTopLeftRadius) || 0,
            dockBackdrop: getComputedStyle(dock).backdropFilter || getComputedStyle(dock).webkitBackdropFilter || "",
            liquidIndicator: Boolean(liquidIndicator),
            liquidWidth: Math.round(indicatorRect?.width || 0),
            liquidRadius: parseFloat(getComputedStyle(liquidIndicator).borderTopLeftRadius) || 0,
            heroTop: Math.round(heroRect?.top || 0),
            headerBottom: Math.round(topbarRect?.bottom || 0),
            heroRadius: parseFloat(getComputedStyle(d.querySelector("#home .social-hero")).borderTopLeftRadius) || 0
          };
          assert(mobileVisual.visibleHeaderActions === 3 && mobileVisual.headerFits, "手机顶部操作区拥挤或溢出");
          assert(mobileVisual.minHeaderTarget >= 44 && mobileVisual.dockTarget >= 44 && mobileVisual.dockRadius >= 18, "手机触控区域或底栏圆角不符合要求");
          assert(mobileVisual.liquidIndicator && mobileVisual.liquidWidth >= 44 && mobileVisual.liquidRadius >= 16, "iOS 液态底栏指示器没有正确显示");
          assert(mobileVisual.heroTop >= mobileVisual.headerBottom && mobileVisual.heroRadius >= 18, "手机首屏标题被遮挡或卡片圆角丢失");

          const maxScroll = Math.max(0, d.documentElement.scrollHeight - w.innerHeight);
          if (maxScroll > 180) {
            w.scrollTo({ top: Math.min(520, maxScroll), behavior: "instant" });
            await wait(80);
            mobileVisual.dockMinimized = dock.classList.contains("is-minimized");
            mobileVisual.scrollAfterDown = Math.round(w.scrollY);
            mobileVisual.dockStateAfterDown = {
              minimized: w.blogMobileShell?.state.minimized,
              lastScrollY: Math.round(w.blogMobileShell?.state.lastScrollY || 0),
              scrollTravel: Math.round(w.blogMobileShell?.state.scrollTravel || 0)
            };
            w.scrollTo({ top: 0, behavior: "instant" });
            await wait(80);
            mobileVisual.dockRestored = !dock.classList.contains("is-minimized");
            assert(mobileVisual.dockMinimized && mobileVisual.dockRestored, `液态底栏滚动收拢或恢复失败：${JSON.stringify({ maxScroll, visual: mobileVisual, state: w.blogMobileShell?.state })}`);
          }

          w.blogUI?.navigate?.("about", { history: false });
          await wait(40);
          mobileVisual.secondaryPageIndicatorHidden = !dock.classList.contains("has-active");
          w.blogUI?.navigate?.("home", { history: false });
          await wait(280);
          mobileVisual.primaryPageIndicatorRestored = dock.classList.contains("has-active");
          assert(mobileVisual.secondaryPageIndicatorHidden && mobileVisual.primaryPageIndicatorRestored, "底栏在非主标签页面显示了错误激活状态");
          d.querySelector("#menuBtn").click();
          await wait(50);
          const drawer = d.querySelector(".topbar nav");
          const mobileDrawer = {
            open: drawer?.classList.contains("open"),
            bodyOpen: d.body.classList.contains("nav-open"),
            interactive: !drawer?.hasAttribute("inert") && getComputedStyle(drawer).pointerEvents !== "none",
            wallpaperEntry: Boolean(drawer?.querySelector("[data-open-wallpaper]"))
          };
          assert(mobileDrawer.open && mobileDrawer.bodyOpen && mobileDrawer.interactive, "手机侧栏无法正常交互");
          assert(mobileDrawer.wallpaperEntry, "手机侧栏缺少壁纸入口");
          w.blogUI.navigate("about", { history: false, animate: false });
          await wait(20);
          mobileDrawer.programmaticClose = !drawer.classList.contains("open")
            && !d.body.classList.contains("nav-open")
            && drawer.hasAttribute("inert")
            && drawer.getAttribute("aria-hidden") === "true"
            && d.querySelector("#navBackdrop")?.getAttribute("aria-hidden") === "true";
          assert(mobileDrawer.programmaticClose, "手机程序化切页后侧栏的交互与无障碍状态没有完整复位");
          w.blogUI.navigate("home", { history: false, animate: false });
          d.querySelector("#menuBtn").click();
          await wait(30);
          drawer.querySelector("[data-open-wallpaper]").click();
          await wait(50);
          const wallpaperPanel = {
            open: d.querySelector("#wallpaperDialog")?.open,
            drawerClosed: !drawer.classList.contains("open") && !d.body.classList.contains("nav-open"),
            opacityControl: Boolean(d.querySelector("#panelOpacity"))
          };
          assert(wallpaperPanel.open && wallpaperPanel.drawerClosed, "从手机侧栏打开壁纸面板失败");
          assert(wallpaperPanel.opacityControl, "壁纸面板缺少透明度控制");
          w.blogUI.closeDialog(d.querySelector("#wallpaperDialog"));
          await wait(320);
          Object.assign(w.blogAuth, {
            isAdmin: true,
            isOwner: true,
            profile: { id: viewer.id, username: "Cnbdg", user_uid: 1, display_title: "站长", is_admin: true, is_owner: true },
            listAllPosts: async () => [{ id: 1, title: "管理界面自检文章", status: "published", published_at: new Date().toISOString() }],
            getGovernanceOverview: async () => ({ data: { pending_reports: 2, restricted_users: 1, pending_appeals: 0, actions_today: 3 }, error: "" }),
            listModerationReports: async () => ({ rows: [], error: "" }),
            listModerationUsers: async () => ({ rows: [], error: "" }),
            listModerationAppeals: async () => ({ rows: [], error: "" }),
            listModerationActions: async () => ({ rows: [], error: "" }),
            prepareAdminCaptcha() {},
            getAdminMemberByUid: async () => ({ member: { user_id: viewer.id, user_uid: 1, username: "Cnbdg", display_title: "站长", is_admin: true, is_owner: true, restricted: false, strike_count: 0 }, error: "" }),
            refreshProfile: async () => true,
            adminCaptchaReady: true
          });
          w.dispatchEvent(new w.CustomEvent("blog-auth-change", { detail: { user: viewer, profile: w.blogAuth.profile } }));
          w.blogUI.navigate("admin", { history: false, animate: false });
          await wait(150);
          const mobileAdmin = {
            workspaceVisible: !d.querySelector("#adminWorkspace")?.hidden,
            title: d.querySelector("#admin .admin-header h1")?.textContent,
            role: d.querySelector("#adminIdentityRole")?.textContent,
            commandWidth: Math.round(d.querySelector(".admin-command-center")?.getBoundingClientRect().width || 0),
            quickActions: d.querySelectorAll(".admin-quick-actions button").length,
            horizontalScroll: d.documentElement.scrollWidth - d.documentElement.clientWidth
          };
          assert(mobileAdmin.workspaceVisible && mobileAdmin.title === "管理中心" && mobileAdmin.role === "永久站长", "手机管理中心身份或工作区异常");
          assert(mobileAdmin.commandWidth <= 380 && mobileAdmin.quickActions === 3 && mobileAdmin.horizontalScroll <= 1, `手机管理中心拥挤或横向溢出：${JSON.stringify(mobileAdmin)}`);
          w.openMemberAdmin(1);
          await wait(100);
          const ownerRect = d.querySelector("#memberAdminDialog")?.getBoundingClientRect();
          mobileAdmin.ownerDialog = {
            open: d.querySelector("#memberAdminDialog")?.open,
            width: Math.round(ownerRect?.width || 0),
            roleLocked: d.querySelector('#memberAdminForm [name="role_action"]')?.disabled,
            protected: d.querySelector("#ownerProtectionBanner")?.dataset.state === "protected"
          };
          assert(mobileAdmin.ownerDialog.open && mobileAdmin.ownerDialog.width <= 390 && mobileAdmin.ownerDialog.roleLocked && mobileAdmin.ownerDialog.protected, `手机权限面板布局或保护状态异常：${JSON.stringify(mobileAdmin.ownerDialog)}`);
          w.blogUI.closeDialog(d.querySelector("#memberAdminDialog"));
          finish("pass", { mode, baseChecks, overlayLifecycle, toastLifecycle, paginationCheck, listResult, threadResult, mobileOpen, mobileClosed, createDialog, mobileMotion, mobileVisual, mobileDrawer, wallpaperPanel, mobileAdmin });
        } catch (error) {
          finish("fail", { mode, error: error.stack || error.message || String(error) });
        }
      }, { once: true });
      frame.src = "/__self-check-index.html";
    })();
  </script>
</body>
</html>
